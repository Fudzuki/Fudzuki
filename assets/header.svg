    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="118" font-size="22" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt; hello, world<tspan class="caret">_</tspan></text>
      <text x="70" y="182" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="1">Hi, I'm Kusanagi</text>
      <text x="74" y="226" font-size="22" fill="#a5c8ff">@Fudzuki  ·  Wideplink / Discope / TAO  ·  Japan</text>
