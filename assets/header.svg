    <circle cx="0" cy="67" r="5.5" fill="#ffd45c" stroke="#d9a520" stroke-width="1"/>
    <path d="M-3,68 h6" stroke="#9a6d00" stroke-width="1.2" stroke-linecap="round"/>
    <!-- head -->
