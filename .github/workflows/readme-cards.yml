# Render the GitHub stats / top languages cards with a PAT so private contributions
# and private repositories are counted, and commit them to assets/.
name: Update README cards

on:
  schedule:
    - cron: "0 15 * * *" # daily, 00:00 JST
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # STATS_TOKEN: classic PAT with repo + read:user. Falls back to GITHUB_TOKEN (public data only).
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=30,030b1f,0a2259,1450b8&title_color=79c0ff&icon_color=58a6ff&text_color=dbe9ff&ring_color=58a6ff&count_private=true
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=30,030b1f,0a2259,1450b8&title_color=79c0ff&text_color=dbe9ff
          path: assets/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README cards"
          git push
